<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>СОВЬЯКИ ПАРК — Питомник растений</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      color: #2b3831;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f7f6f2; /* Пастельный светлый фон */
      padding: 12px 15px;
      position: relative;
    }

    /* Фоновая абстракция дерева */
    .bg-tree-abstract {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 500px;
      height: 100%;
      max-height: 700px;
      z-index: 0;
      opacity: 0.10;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto;
    }

    /* Компактная векторная эмблема питомника */
    .brand-logo-svg {
      width: 100%;
      max-width: 190px;
      height: auto;
      margin-bottom: 12px;
    }

    /* Компактные заголовки */
    .title { 
      font-size: 17px; 
      font-weight: 600; 
      line-height: 1.3; 
      margin-bottom: 6px; 
      color: #006b4d; 
    }
    .description { 
      font-size: 11.5px; 
      font-weight: 400; 
      color: #576b60; 
      line-height: 1.4; 
      margin-bottom: 14px; 
    }
    .section-label { 
      font-size: 10.5px; 
      font-weight: 600; 
      color: #7d9084; 
      margin-bottom: 8px; 
      text-transform: uppercase; 
      letter-spacing: 1.2px; 
    }
    
    /* Соцсети */
    .socials { 
      display: flex; 
      justify-content: center; 
      gap: 12px; 
      margin-bottom: 14px; 
    }
    .social-btn {
      width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: all 0.2s ease;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
    }
    .social-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 14px rgba(0,0,0,0.1); }
    .bg-vk { background: #0077FF; }
    .bg-insta { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%); }

    /* Кнопки связи */
    .cards { width: 100%; display: flex; flex-direction: column; gap: 9px; margin-bottom: 14px; }
    .card {
      width: 100%; 
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 107, 77, 0.15); 
      border-radius: 14px;
      padding: 10px 14px; 
      display: flex; align-items: center; justify-content: space-between;
      text-decoration: none; color: inherit; transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 107, 77, 0.04);
    }
    .card:hover { 
      background: #ffffff; 
      transform: translateY(-1px); 
      border-color: #006b4d;
      box-shadow: 0 6px 18px rgba(0, 107, 77, 0.1);
    }
    .card-left { display: flex; align-items: center; gap: 12px; text-align: left; }
    .card-title { font-size: 13.5px; font-weight: 600; color: #1e2823; }
    .card-subtitle { font-size: 12px; font-weight: 500; color: #006b4d; margin-top: 1px; }
    .card-arrow { color: #8a9b91; font-size: 12px; }

    /* Иконки кнопок */
    .icon-box {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .icon-phone { background: rgba(0, 107, 77, 0.1); }
    .icon-tg { background: #2AABEE; }

    .footer { font-size: 10.5px; color: #8a9c91; font-weight: 400; }
  </style>
</head>
<body>

  <!-- Фоновая абстракция дерева -->
  <svg class="bg-tree-abstract" viewBox="0 0 500 700" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M250 650V350" stroke="#006b4d" stroke-width="3" stroke-linecap="round"/>
    <path d="M250 520C250 520 200 480 170 450" stroke="#006b4d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M250 470C250 470 310 430 340 390" stroke="#006b4d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M250 410C250 410 180 370 150 310" stroke="#006b4d" stroke-width="2" stroke-linecap="round"/>
    <circle cx="250" cy="220" r="110" stroke="#7a6242" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="250" cy="200" r="80" stroke="#006b4d" stroke-width="1.5"/>
    <circle cx="160" cy="300" r="55" stroke="#7a6242" stroke-width="1.5"/>
    <circle cx="340" cy="260" r="65" stroke="#006b4d" stroke-width="1.5" stroke-dasharray="6 6"/>
  </svg>

  <div class="container">
    
    <!-- Эмблема «СОВЬЯКИ ПАРК» -->
    <svg class="brand-logo-svg" viewBox="0 0 280 190" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="6" y="6" width="268" height="135" stroke="#006b4d" stroke-width="5" fill="none"/>
      
      <!-- Текст названия -->
      <text x="140" y="72" font-family="'Playfair Display', serif" font-size="37" font-weight="700" fill="#006b4d" text-anchor="middle">СОВЬЯКИ</text>
      
      <!-- Векторное каплевидное ударение над буквой Я -->
      <path transform="translate(7, 0)" d="M 157 44.5 C 158.2 40 161.5 33 165.2 31.8 C 168.2 30.8 170.2 34 167.8 37 C 165 40.5 160.2 43.8 157 44.5 Z" fill="#006b4d"/>

      <text x="140" y="116" font-family="'Montserrat', sans-serif" font-size="26" font-weight="500" fill="#006b4d" letter-spacing="5" text-anchor="middle">ПАРК</text>
      <text x="140" y="172" font-family="'Montserrat', sans-serif" font-size="13.5" font-weight="500" fill="#006b4d" letter-spacing="3" text-anchor="middle">ПИТОМНИК РАСТЕНИЙ</text>
    </svg>

    <h1 id="mainHeading" class="title"></h1>
    <p id="subHeading" class="description"></p>

    <div class="section-label">Мы в соцсетях</div>
    <div class="socials">
      <a id="linkVk" href="#" class="social-btn bg-vk" target="_blank" title="ВКонтакте"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M15.073 2H8.937C3.37 2 2 3.37 2 8.937v6.126C2 20.63 3.37 22 8.937 22h6.126C20.63 22 22 20.63 22 15.063V8.937C22 3.37 20.63 2 15.073 2zm3.07 13.665h-1.32c-.528 0-.69-.42-.69-.42-.822-1.528-1.528-2.128-2.128-2.128-.46 0-.585.195-.585.73v1.233c0 .356-.115.585-1.04.585-1.528 0-3.218-.93-4.408-2.65-1.722-2.388-2.238-4.185-2.238-4.54 0-.195.073-.377.447-.377h1.32c.334 0 .46.153.586.505.642 1.86 1.722 3.493 2.164 3.493.167 0 .25-.08.25-.515V9.458c-.056-.93-.544-1.01-.544-1.344 0-.16.136-.32.355-.32h2.08c.28 0 .39.148.39.48v2.607c0 .28.125.377.208.377.167 0 .307-.096.613-.404 1.018-1.144 1.743-2.906 1.743-2.906.096-.21.25-.377.585-.377h1.32c.39 0 .475.21.39.48-.153.712-1.658 2.85-1.658 2.85-.139.223-.195.334 0 .585.14.195.6.586 1.018 1.073 1.017 1.157 1.254 1.658 1.393 1.895.14.28 0 .586-.39.586z"/></svg></a>
      <a id="linkInsta" href="#" class="social-btn bg-insta" target="_blank" title="Instagram"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg></a>
    </div>

    <!-- КНОПКИ СВЯЗИ -->
    <div class="cards">
      
      <!-- 1. Телефон -->
      <a id="cardPhoneUrl" href="#" class="card">
        <div class="card-left">
          <div class="icon-box icon-phone">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="#006b4d"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
          </div>
          <div>
            <div class="card-title">Связаться с нами</div>
            <div id="cardPhoneText" class="card-subtitle"></div>
          </div>
        </div>
        <div class="card-arrow">❯</div>
      </a>

      <!-- 2. MAX -->
      <a id="cardMaxUrl" href="#" class="card" target="_blank">
        <div class="card-left">
          <svg class="icon-box" width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" rx="26" fill="url(#maxGrad)"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M50 12C70.9868 12 88 29.0132 88 50C88 70.9868 70.9868 88 50 88C42.2 88 34.9 85.6 28.8 81.4C22.5 85.5 17.2 87.8 17.2 87.8C17.2 87.8 16.5 80.2 19.4 72.8C14.7 66.3 12 58.5 12 50C12 29.0132 29.0132 12 50 12ZM50 31C39.5066 31 31 39.5066 31 50C31 55.8 33.6 61 37.7 64.5C39.1 65.7 39.6 67.7 38.9 69.4C38.1 71.5 36.8 74.2 36.8 74.2C36.8 74.2 39.9 73.6 42.6 71.8C44 70.9 45.7 70.6 47.3 70.9C48.2 71 49.1 71 50 71C60.4934 71 69 62.4934 69 52C69 41.5066 60.4934 31 50 31Z" fill="white"/>
            <defs>
              <linearGradient id="maxGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#1CB5FF"/>
                <stop offset="50%" stop-color="#4B5BFF"/>
                <stop offset="100%" stop-color="#AA2BFF"/>
              </linearGradient>
            </defs>
          </svg>
          <div class="card-title">Написать нам в MAX</div>
        </div>
        <div class="card-arrow">❯</div>
      </a>

      <!-- 3. Telegram -->
      <a id="cardTgUrl" href="#" class="card" target="_blank">
        <div class="card-left">
          <div class="icon-box icon-tg">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
          </div>
          <div class="card-title">Написать нам в Telegram</div>
        </div>
        <div class="card-arrow">❯</div>
      </a>

    </div>

    <div class="footer">Ваши данные в безопасности</div>
  </div>

  <script src="config.js"></script>
  <script>
    document.getElementById('mainHeading').innerHTML = SITE_DATA.brand.mainHeading;
    document.getElementById('subHeading').innerHTML = SITE_DATA.brand.subHeading;

    document.getElementById('linkVk').href = SITE_DATA.socials.vk;
    document.getElementById('linkInsta').href = SITE_DATA.socials.instagram;

    document.getElementById('cardPhoneUrl').href = SITE_DATA.contacts.phoneUrl;
    document.getElementById('cardPhoneText').innerText = SITE_DATA.contacts.phoneText;

    document.getElementById('cardMaxUrl').href = SITE_DATA.contacts.maxUrl;
    document.getElementById('cardTgUrl').href = SITE_DATA.contacts.tgUrl;
  </script>
</body>
</html>
